[package]
name = "program-test"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-compiler-builtins = { path = ".." }

[dev-dependencies]
mollusk-svm = "0.14.0"
solana-instruction = "3.4.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
