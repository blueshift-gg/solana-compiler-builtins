[target.bpfel-unknown-none]
rustflags = [
    "-C",
    "linker=sbpf-linker",
    "-C",
    "panic=abort",
    "-C",
    "relocation-model=static",
    "-C",
    "link-arg=--llvm-args=--bpf-stack-size=4096",
    "-C",
    "link-arg=--llvm-args=--bpf-allows-libcalls",
    "-C",
    "link-arg=--export=__multi3,__adddf3,__subdf3,__muldf3,__divdf3,__negdf2,__floatundidf,__fixunsdfdi,__gedf2,__gtdf2",
]

[alias]
build-bpf = "build --release --target bpfel-unknown-none -Z build-std=core,alloc"
