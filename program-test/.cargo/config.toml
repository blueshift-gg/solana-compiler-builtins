[target.bpfel-unknown-none]
rustflags = [
    "-C",
    "linker=sbpf-linker",
    "-C",
    "panic=abort",
    "-C",
    "relocation-model=static",
    "-C",
    "target-cpu=v4",
    "-Z",
    "llvm-target-feature=+allows-misaligned-mem-access",
    "-C",
    "link-arg=--llvm-args=--bpf-stack-size=4096",
    "-C",
    "link-arg=--llvm-args=--bpf-max-stores-per-memfunc=5",
    "-C",
    "link-arg=--cpu-features=+allows-misaligned-mem-access",
    "-C",
    "link-arg=--llvm-args=--disable-gotox",
    "-C",
    "link-arg=--llvm-args=--disable-ldsx",
    "-C",
    "link-arg=--llvm-args=--disable-movsx",
    "-C",
    "link-arg=--llvm-args=--disable-bswap",
    "-C",
    "link-arg=--llvm-args=--disable-gotol",
    "--cfg=target_os=\"solana\"",
    "--cfg=target_feature=\"static-syscalls\"",
    "-A",
    "explicit_builtin_cfgs_in_flags",
    "-C",
    "link-arg=--export=__multi3,__udivti3,__umodti3,__addsf3,__subsf3,__mulsf3,__divsf3,__floatunsisf,__floatsisf,__floatdisf,__floatundisf,__ltsf2,__lesf2,__eqsf2,__nesf2,__gtsf2,__gesf2,__unordsf2,__adddf3,__subdf3,__muldf3,__divdf3,__negdf2,__floatundidf,__floatunsidf,__floatdidf,__floatsidf,__fixunssfdi,__fixsfdi,__fixunssfsi,__fixsfsi,__fixunsdfsi,__fixdfdi,__fixdfsi,__fixunsdfsi,__ltdf2,__ledf2,__eqdf2,__nedf2,__unorddf2,__gedf2,__gtdf2",
]

[alias]
build-bpf = "build --release --target bpfel-unknown-none -Z build-std=core,alloc"
