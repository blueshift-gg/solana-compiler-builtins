name: Release

run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        run: |
          v=$(yq -e '.package.version' Cargo.toml)
          test "v$v" = "${GITHUB_REF_NAME}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version v$v"; exit 1; }

      - name: Get nightly toolchain version
        id: nightly
        run: echo "version=$(make nightly-version)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.nightly.outputs.version }}
          components: rust-src

      - name: Install sbpf linker (build from source)
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: sbpf-linker
          fallback: cargo-install

      - name: Run tests
        run: make program-test

  crates:
    name: Publish crates and create draft release notes
    needs: validate
    permissions:
      contents: write
      id-token: write
    uses: blueshift-gg/github-actions/.github/workflows/release-crates.yml@master
    with:
      tag: ${{ github.ref_name }}
      environment: release
      timeout-minutes: 15
